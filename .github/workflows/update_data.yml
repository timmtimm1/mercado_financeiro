name: Atualizar dados do painel B3

on:
  schedule:
    # 21:15 UTC = 18:15 horário de Brasília, depois do fechamento da B3 (18h),
    # de segunda a sexta (o mercado não abre no fim de semana)
    - cron: "15 21 * * 1-5"
  workflow_dispatch:
    inputs:
      tickers:
        description: >
          Papéis específicos, separados por espaço (ex: PETR4.SA VALE3.SA). Deixe em
          branco pra rodar a lista completa do config/tickers.yaml (comportamento do
          agendamento normal). Uma seleção avulsa não sobrescreve o dataset principal
          do painel — grava em data/consulta_*.csv.
        required: false
        default: ""

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar pipeline
        working-directory: src
        # TICKERS vem de env, nunca interpolado direto no script — evita injeção de
        # comando a partir do input do workflow_dispatch.
        env:
          TICKERS: ${{ inputs.tickers }}
        run: python pipeline.py $TICKERS

      - name: Commitar dados atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "Sem mudanças nos dados" || git commit -m "Atualiza dados do painel ($(date -u +%Y-%m-%d))"
          git push
